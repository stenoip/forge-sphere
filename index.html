<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ForgeSphere - Immersive AR Game</title>
    <style>
        /* Basic Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            font-family: Arial, sans-serif;
            height: 100%;
            background-color: #111;
            color: #fff;
            overflow: hidden;
        }

        /* Main layout container */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
            position: relative;
            z-index: 10;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: bold;
            letter-spacing: 5px;
            opacity: 0;
            transform: translateY(50px);
            animation: fadeIn 2s forwards, slideUp 1s 1s forwards;
        }

        .tagline {
            font-size: 1.5rem;
            color: #28a745;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeIn 2s forwards, slideUp 1s 1.5s forwards;
        }

        .cta-button {
            padding: 15px 30px;
            font-size: 1.2rem;
            background-color: #28a745;
            color: #fff;
            border: none;
            border-radius: 30px;
            margin-top: 30px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeIn 2s forwards, slideUp 1s 2s forwards;
            transition: background-color 0.3s;
        }

        .cta-button:hover {
            background-color: #218838;
        }

        .copyright {
            position: absolute;
            bottom: 20px;
            font-size: 0.8rem;
            color: #777;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            to {
                transform: translateY(0);
            }
        }

        .video-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .video-container video {
            object-fit: cover;
            width: 100%;
            height: 100%;
            opacity: 0.6;
            animation: fadeInVideo 3s ease-out forwards;
        }

        @keyframes fadeInVideo {
            to {
                opacity: 0.6;
            }
        }

        /* Responsive Design */
        @media screen and (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }

            .tagline {
                font-size: 1.2rem;
            }

            .cta-button {
                font-size: 1rem;
                padding: 12px 24px;
            }
        }
    </style>
</head>
<body>
    <div class="video-container">
        <video autoplay loop muted>
            <source src="demo-video.mp4" type="video/mp4">
        
        </video>
    </div>

    <div class="container">
        <canvas id="cubeCanvas" width="400" height="400"></canvas>
        <h1>ForgeSphere</h1>
        <p class="tagline">Build, Explore, and Shape Your AR World</p>
        <a href="play.html">
            <button class="cta-button" id="start">Start Your Adventure</button>
        </a>
    </div>

    <div class="copyright">
        © 2025 Stenoip Company. All Rights Reserved.
    </div>

    <script>
        var canvas = document.getElementById('cubeCanvas');
        var ctx = canvas.getContext('2d');
        var centerX = canvas.width / 2, centerY = canvas.height / 2;
        var size = 100, angleX = 0, angleY = 0;

        var vertices = [
            [-size, -size, -size], [size, -size, -size], [size, size, -size], [-size, size, -size],
            [-size, -size, size], [size, -size, size], [size, size, size], [-size, size, size]
        ];

        var edges = [
            [0, 1], [1, 2], [2, 3], [3, 0],
            [4, 5], [5, 6], [6, 7], [7, 4],
            [0, 4], [1, 5], [2, 6], [3, 7]
        ];

        var colors = ['#FF0000', '#FF7F00', '#FFFF00', '#00FF00', '#0000FF', '#8B00FF'];

        function rotate(x, y, z, angleX, angleY) {
            var tempY = y * Math.cos(angleX) - z * Math.sin(angleX);
            var tempZ = y * Math.sin(angleX) + z * Math.cos(angleX);
            y = tempY;
            z = tempZ;
            var tempX = x * Math.cos(angleY) + z * Math.sin(angleY);
            z = -x * Math.sin(angleY) + z * Math.cos(angleY);
            x = tempX;
            return [x, y, z];
        }

        function project(x, y, z) {
            var scale = 300 / (300 + z);
            var x2D = x * scale + centerX, y2D = -y * scale + centerY;
            return [x2D, y2D];
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            var rotatedVertices = vertices.map(function(vertex) {
                var coords = rotate(vertex[0], vertex[1], vertex[2], angleX, angleY);
                return project(coords[0], coords[1], coords[2]);
            });

            ctx.lineWidth = 2;
            edges.forEach(function(edge, index) {
                var [x1, y1] = rotatedVertices[edge[0]];
                var [x2, y2] = rotatedVertices[edge[1]];
                ctx.strokeStyle = colors[index % colors.length];
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();
            });
        }

        function animate() {
            angleX += 0.01;
            angleY += 0.01;
            draw();
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
